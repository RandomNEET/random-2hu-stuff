# Debian /etc/nginx/sites-available/random-2hu-stuff (included inside http {}).
# Only successful Vite content-hashed assets are immutable. Other files revalidate.
map "$status:$uri" $r2s_static_cache_control {
    default "no-cache";
    ~^5 "no-store";
    ~^(200|206|304):/assets/.+-[A-Za-z0-9_-]+\.[A-Za-z0-9]+$ "public, max-age=31536000, immutable";
    ~^[0-9]+:/api/ "";
    ~^[0-9]+:/health$ "no-store";
}

upstream r2s_backend {
    server 127.0.0.1:3000;
    keepalive 16;
    # Node 20 defaults to a 5s idle timeout; retire pooled connections earlier.
    keepalive_timeout 4s;
}

server {
    listen 80;
    server_name random-2hu-stuff.randomneet.me;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/random-2hu-stuff/frontend/dist;
        try_files $uri =404;
    }
    location / {
        return 301 https://random-2hu-stuff.randomneet.me$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name random-2hu-stuff.randomneet.me;
    root /var/www/random-2hu-stuff/frontend/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/random-2hu-stuff.randomneet.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/random-2hu-stuff.randomneet.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:r2s_SSL:10m;
    ssl_session_timeout 1h;

    # Keep all add_header directives at one level: Debian nginx 1.26 does not
    # merge parent headers when a location declares its own add_header.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $r2s_static_cache_control always;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    server_tokens off;
    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types application/javascript application/json application/manifest+json
               application/xml image/svg+xml text/css text/javascript text/plain text/xml;

    # Shared ordinary HTTP proxy settings; this application has no WebSockets.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    # Backend already caches results. Avoid an additional Nginx cache layer.
    proxy_cache off;

    location ^~ /api/ {
        proxy_pass http://r2s_backend;
    }
    location = /health {
        proxy_pass http://r2s_backend;
        proxy_hide_header Cache-Control;
        access_log off;
    }

    # Deny hidden and editor backup files before matching static extensions.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    # Missing assets must return 404, never the SPA HTML shell.
    location /assets/ {
        try_files $uri =404;
        access_log off;
    }
    location ~* \.(?:js|mjs|css|map|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|eot|html|txt|json|webmanifest)$ {
        try_files $uri =404;
        access_log off;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/random-2hu-stuff.access.log;
    error_log /var/log/nginx/random-2hu-stuff.error.log;
}
